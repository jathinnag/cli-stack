<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>cli-stack</title>

    <!-- App icon = an emoji drawn into an SVG, used directly as the favicon.
         This is what shows in the window title bar and the taskbar.
         To use a different icon, just change the emoji below (the 🖥️). -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>"
    />

    <link rel="stylesheet" href="vendor/xterm.css" />

    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }

      /* Every clickable control is a real <button> (keyboard + screen
         readers); this strips the browser chrome so each styles itself. */
      .ui-btn {
        appearance: none;
        background: none;
        border: 0;
        margin: 0;
        padding: 0;
        font: inherit;
        color: inherit;
        cursor: pointer;
        text-align: inherit;
      }
      .ui-btn:focus-visible { outline: 2px solid #3a78ff; outline-offset: 1px; }
      /* Tabs live in a clipped scroller, so their ring is drawn inside. */
      .tab:focus-visible { outline: 2px solid #3a78ff; outline-offset: -2px; }
      @media (prefers-reduced-motion: reduce) {
        #grid.zoom-anim .split-child,
        .pane-btn,
        .gutter::before { transition: none; }
      }

      /* ---- Browser-style tab strip ---- */
      #tabbar {
        height: 36px;
        box-sizing: border-box;
        background: #141414;
        display: flex;
        align-items: stretch;
        padding: 5px 6px 0 6px;
        gap: 4px;
        border-bottom: 1px solid #2a2a2a;
        overflow: hidden;
      }
      /* Mirrors the ⋮ button's footprint on the left so the tabs stay
         centred in the bar rather than sitting slightly off to one side. */
      #tabbar::before {
        content: "";
        flex: 0 0 30px;
      }

      /* The tabs themselves live in an inner strip so re-rendering them
         leaves the ⋮ button alone. It's also the scroller: with many tabs
         they scroll here, and the ⋮ stays pinned to the right edge.
         `safe center` keeps the leftmost tab reachable once they overflow. */
      #tabs {
        display: flex;
        flex: 1 1 auto;
        align-items: stretch;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: center;
        justify-content: safe center;
      }
      #tabs::-webkit-scrollbar { height: 0; }
      /* Fade whichever edge has tabs hidden beyond it (classes set in JS). */
      #tabs.can-left {
        mask-image: linear-gradient(to right, transparent, #000 28px);
      }
      #tabs.can-right {
        mask-image: linear-gradient(to left, transparent, #000 28px);
      }
      #tabs.can-left.can-right {
        mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px 0 12px;
        background: #1f1f1f;
        border: 1px solid #2a2a2a;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        color: #9a9a9a;
        font-size: 12px;
        cursor: pointer;
        max-width: 200px;
        white-space: nowrap;
        user-select: none;
      }
      .tab:hover { background: #262626; }
      .tab.active { background: #000; color: #fff; border-color: #3a3a3a; }
      .tab-title { overflow: hidden; text-overflow: ellipsis; }
      .tab-rename {
        width: 110px;
        background: #2a2a2a;
        border: 1px solid #3a6df0;
        border-radius: 4px;
        color: #fff;
        font: inherit;
        padding: 1px 4px;
        outline: none;
      }
      .tab-count {
        font-size: 11px;
        color: #a3a3a3;
        background: #2a2a2a;
        border-radius: 8px;
        padding: 0 5px;
      }
      .tab.active .tab-count { color: #9bb6ff; background: #1a2540; }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        border-radius: 4px;
        width: 16px;
        height: 16px;
      }
      .tab-close svg { width: 10px; height: 10px; }
      .tab-close:hover { background: #c0392b; color: #fff; }
      .tab-add {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        color: #ccc;
        border-radius: 6px;
        margin-bottom: 1px;
      }
      .tab-add svg { width: 14px; height: 14px; }
      .tab-add:hover { background: #2a2a2a; color: #fff; }

      /* ⋮ overflow menu, pinned to the right edge of the tab strip.
         Its 24px box + 6px of margin = the 30px spacer above. */
      #menu-btn {
        align-self: center;
        flex: 0 0 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin: 0 2px 4px 4px;
        padding: 0;
        background: transparent;
        color: #999;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #menu-btn:hover { background: #2a2a2a; color: #fff; }
      /* Stays lit while its menu is open. */
      #menu-btn.open { background: #2a2a2a; color: #fff; }

      /* The menu it drops down: same look as the pane right-click menu. */
      #app-menu {
        position: fixed;
        top: 38px;
        right: 8px;
        min-width: 200px;
        background: #1b1b1b;
        border: 1px solid #3d3d3d;
        border-radius: 8px;
        padding: 4px;
        z-index: 50;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        color: #ddd;
        user-select: none;
      }
      #app-menu.hidden { display: none; }
      /* Focus-zoom resizes glide; the class is only present during a
         zoom-driven change so gutter drags stay direct. */
      #grid.zoom-anim .split-child { transition: flex-grow 0.25s ease; }

      /* ---- Snap-Layouts-style picker flyout ---- */
      #picker {
        position: fixed;
        top: 40px;
        right: 8px;
        background: #1b1b1b;
        border: 1px solid #3d3d3d;
        border-radius: 10px;
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 12px;
        z-index: 10;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      #picker.hidden { display: none; }

      .layout-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .layout-option:hover { background: #2a2a2a; }

      .mini-grid {
        width: 64px;
        height: 46px;
        display: flex;
        gap: 3px;
      }
      .mini-cell { background: #3a78ff; border-radius: 3px; flex: 1; }
      .layout-label { color: #bbb; font-size: 11px; }

      /* ---- The split-tree of terminal panes ---- */
      #grid {
        height: calc(100% - 36px);
        display: flex;
        box-sizing: border-box;
      }

      /* A split container holds children laid out in a row or column. */
      .split {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .split.row { flex-direction: row; }
      .split.col { flex-direction: column; }

      /* A wrapper around each child of a split (its size is set in JS). */
      .split-child {
        display: flex;
        flex-basis: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      /* The draggable divider between two panes.
         The gutter itself is a roomy (invisible) grab area; the visible LINE is
         a thin centered ::before that's inset at its ends and glows on hover. */
      .gutter {
        background: transparent;
        flex: 0 0 6px;       /* grab area width — must match GUTTER in renderer.js */
        position: relative;
        z-index: 2;
      }
      .gutter::before {
        content: "";
        position: absolute;
        background: #1a1a1a;
        border-radius: 2px;
        transition: background 0.1s, box-shadow 0.1s;
      }
      /* Vertical line (side-by-side panes): thin in width, padded top & bottom. */
      .gutter.row { cursor: col-resize; }
      .gutter.row::before {
        top: 8px; bottom: 8px;
        left: 50%; width: 2px; transform: translateX(-50%);
      }
      /* Horizontal line (stacked panes): thin in height, padded left & right. */
      .gutter.col { cursor: row-resize; }
      .gutter.col::before {
        left: 8px; right: 8px;
        top: 50%; height: 2px; transform: translateY(-50%);
      }
      .gutter:hover::before {
        background: #ffd23f;
        box-shadow: 0 0 8px 2px rgba(255, 210, 63, 0.7);
      }

      /* A single terminal pane. */
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        background: #000;
      }
      .pane.active { border-color: #3a78ff; }
      .pane-term { width: 100%; height: 100%; }

      /* ---- "Where should this terminal start?" chooser ---- */
      .start-overlay {
        position: absolute;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* `safe center` falls back to start-alignment when the content is
           taller than the pane, so the top button stays reachable and the
           overlay scrolls instead of clipping (small split panes). */
        justify-content: center;
        justify-content: safe center;
        gap: 14px;
        padding: 16px 12px;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 8;
      }
      .start-overlay::-webkit-scrollbar { width: 6px; }
      .start-overlay::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      .start-title {
        color: #888;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .start-btn {
        background: #1b1b1b;
        color: #fff;
        border: 1px solid #3d3d3d;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 14px;
        min-width: 260px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.1s, border-color 0.1s;
      }
      .start-btn:hover { background: #222; border-color: #3a78ff; }
      .start-btn:focus-visible { outline: 2px solid #3a78ff; outline-offset: 1px; }
      .start-btn:disabled { opacity: 0.5; cursor: default; }
      /* The real folder path shown beneath the "This directory" label. */
      .start-btn-path {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: #aaa;
        font-family: "Cascadia Mono", Consolas, monospace;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The list of previously-used folders under the "recent" button. */
      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
        max-height: 220px;
        overflow-y: auto;
        width: 300px;
      }
      .recent-list.hidden { display: none; }
      .recent-item {
        background: #141414;
        color: #ddd;
        border: 1px solid #2e2e2e;
        border-radius: 6px;
        padding: 6px 8px 6px 12px;
        font-size: 12px;
        font-family: "Cascadia Mono", Consolas, monospace;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent-item:hover { background: #1f1f1f; border-color: #555; color: #fff; }

      /* ---- Saved folders section (filled by the `save` command) ---- */
      .saved-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 300px;
      }
      .saved-section.hidden { display: none; }
      .section-heading {
        align-self: flex-start;
        color: #888;
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      /* A saved row = clickable path on the left + ✕ remove on the right. */
      .saved-item { display: flex; align-items: center; gap: 8px; }
      .saved-item-path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .saved-remove {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        color: #888;
        border-radius: 4px;
      }
      .saved-remove svg { width: 10px; height: 10px; }
      .saved-remove:hover { background: #c0392b; color: #fff; }

      /* Pane tool strip: focus / save / close, tucked into the top-right
         corner. The strip is a small hot zone — the buttons only appear
         while the pointer (or keyboard focus) is in that corner, so merely
         hovering the pane never paints icons over the first line of output. */
      .pane-tools {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        gap: 4px;
        padding: 4px 6px 6px 8px;
        z-index: 5;
      }
      .pane-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        color: #999;
        background: rgba(40, 40, 40, 0.7);
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.1s;
      }
      .pane-btn svg { display: block; width: 12px; height: 12px; }
      .pane-tools:hover .pane-btn,
      .pane-tools:focus-within .pane-btn { opacity: 1; }
      .pane-btn:hover { background: #2d6cdf; color: #fff; }
      .pane-close:hover { background: #c0392b; color: #fff; }
      /* The pinned pane keeps its focus button lit as a "you're zoomed" cue. */
      .pane-focus.active { opacity: 1; background: #3a78ff; color: #fff; }
      /* A lone terminal can't be closed or zoomed — hide those two. */
      #grid.single .pane-close,
      #grid.single .pane-focus { display: none; }

      /* Right-click menu */
      .context-menu {
        position: fixed;
        background: #1b1b1b;
        border: 1px solid #3d3d3d;
        border-radius: 8px;
        padding: 4px;
        z-index: 50;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        min-width: 160px;
      }
      .context-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 12px;
        color: #ddd;
        font-size: 13px;
        border-radius: 5px;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
      }
      .context-item:hover,
      .context-item:focus-visible { background: #3a78ff; color: #fff; outline: none; }
      .context-key { color: #888; font-size: 11px; }
      .context-item:hover .context-key,
      .context-item:focus-visible .context-key { color: #d6e0ff; }
      .context-item:disabled { color: #666; cursor: default; }
      .context-item:disabled:hover { background: transparent; color: #666; }
      .context-separator {
        height: 1px;
        margin: 4px 6px;
        background: #3d3d3d;
      }
    </style>
  </head>

  <body>
    <!-- Browser-style tabs; each tab is an independent set of terminals -->
    <div id="tabbar">
      <div id="tabs" role="tablist" aria-label="Terminal tabs"></div>
      <button id="menu-btn" class="ui-btn" title="Menu" aria-label="Menu"
              aria-haspopup="menu" aria-controls="app-menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="3" r="1.4" />
          <circle cx="8" cy="8" r="1.4" />
          <circle cx="8" cy="13" r="1.4" />
        </svg>
      </button>
    </div>

    <!-- Drops down from the ⋮ button; its rows are built in renderer.js. -->
    <div id="app-menu" class="hidden" role="menu"></div>

    <div id="picker" class="hidden"></div>

    <!-- The split-tree of terminal panes is built inside here -->
    <div id="grid"></div>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
